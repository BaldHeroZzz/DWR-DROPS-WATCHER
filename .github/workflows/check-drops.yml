name: BaldHero Drops Watcher

on:
  schedule:
    - cron: "2-59/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: baldhero-drops-watcher
  cancel-in-progress: false

jobs:
  check-drops:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validate watcher syntax
        run: node --check check.js

      - name: Check BaldHero feed and send alert if needed
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DROP_API_URL: ${{ vars.DROP_API_URL }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          RAYX_FCM_TOPIC: ${{ vars.RAYX_FCM_TOPIC }}
        run: node check.js

      - name: Save watcher state
        if: always()
        run: |
          if [ -f data/state.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -f data/state.json
            if ! git diff --cached --quiet; then
              git commit -m "chore: update watcher state [skip ci]"
              git push
            else
              echo "Watcher state unchanged."
            fi
          else
            echo "No state file to save yet."
          fi
