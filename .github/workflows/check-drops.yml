name: BaldHero Drops Watcher

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: baldhero-drops-watcher
  cancel-in-progress: false

jobs:
  check-drops:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check BaldHero feed and send alert if needed
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DROP_API_URL: ${{ vars.DROP_API_URL }}
          INACTIVITY_MINUTES: ${{ vars.INACTIVITY_MINUTES }}
        run: node check.js

      - name: Save watcher state
        if: success()
        run: |
          if [ -f data/state.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -f data/state.json
            if ! git diff --cached --quiet; then
              git commit -m "chore: update watcher state [skip ci]"
              git push
            else
              echo "Watcher state unchanged."
            fi
          else
            echo "No state file to save yet."
          fi
